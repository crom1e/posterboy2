services:
  backend:
    image: posterboy2-backend:latest
    container_name: posterboy2-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - PORT=3000
      - MQTT_BROKER_URL=${MQTT_BROKER_URL:-mqtt://mqtt-broker:1883}
      - MQTT_RECONNECT_PERIOD=5000
      - MQTT_CONNECT_TIMEOUT=10000
    ports:
      - "3000:3000"
    expose:
      - "3000"
    restart: unless-stopped

  posterboy2:
    image: posterboy2:latest
    container_name: posterboy2
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./docker/config.js:/usr/share/nginx/html/config.js:ro
    restart: unless-stopped